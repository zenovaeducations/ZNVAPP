<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Zenova Educations</title>

    <link rel="stylesheet" href="login.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <main class="login-container">

        <!-- Logo -->
        <img src="../assets/images/logo.png"
             alt="Zenova Educations"
             class="logo">

        <!-- Brand -->
        <h1 class="brand-name">
            ZENOVA EDUCATIONS
        </h1>

        <p class="tagline">
            Learn. Grow. Achieve.
        </p>

        <!-- Login Card -->
        <section class="login-card">

            <h2>
                Welcome Back 👋
            </h2>

            <p class="description">
                Continue with your Google account to access your classes, notes, videos and live sessions.
            </p>

            <!-- Google Login Button -->
            <button id="googleLoginBtn" class="google-btn">

                <img src="../assets/icons/google.png"
                     alt="Google">

                <span>
                    Continue with Google
                </span>

            </button>

            <!-- Loading -->
            <div id="loading" class="loading hidden">

                <div class="spinner"></div>

                <p>
                    Signing you in...
                </p>

            </div>

        </section>

        <!-- Footer -->
        <footer>

            © 2026 Zenova Educations. All Rights Reserved.

        </footer>

    </main>

    <script type="module" src="login.js"></script>

</body>

</html>
